name: Push checks

# Feature-branch lint + unit tests only. Full lint/build/test for main and PRs
# lives in ci.yml so main is not double-tested on every push.
on:
  push:
    branches-ignore:
      - main

concurrency:
  group: push-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Biome Lint Check
        run: pnpm lint
      - name: Build ADK package
        run: pnpm --filter @iqai/adk build
      - name: ADK tools/mcp true/negzero twentieth leftover slice
        # Reversible focused gate for TOKENMAXX leftover deepen on this module slice.
        run: pnpm --filter @iqai/adk exec vitest run twentieth-leftover-edges
      - name: ADK + CLI tests
        # Matches root `pnpm test` filters; avoids accidental full-monorepo expansion.
        run: pnpm test
